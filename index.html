<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ملک‌سنج">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>ملک‌سنج</title>
<style>
:root{--bg:#eef2f4;--card:#fff;--tx:#17202a;--mu:#64707d;--br:#dbe1e6;--ac:#0f766e;--ac2:#14b8a6;--acb:#e8f6f4;--rd:#b91c1c;--in:#f6f8f9;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#0e1216;--card:#182027;--tx:#eaf0f3;--mu:#93a1ad;--br:#2b3640;--ac:#2dd4bf;--ac2:#14b8a6;--acb:#12302d;--rd:#f87171;--in:#10161b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,"Segoe UI",system-ui,sans-serif;line-height:1.75;-webkit-text-size-adjust:100%}
.hero{background:linear-gradient(135deg,#072f2e,#0f766e 55%,#14b8a6);color:#fff;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 30px) 20px 64px;border-radius:0 0 30px 30px}
.hero h1{font-size:26px;font-weight:800;margin:0 0 4px;letter-spacing:-.3px}
.hero p{margin:0;opacity:.88;font-size:14px}
.hero .upd{display:inline-block;margin-top:12px;font-size:12px;background:rgba(255,255,255,.16);padding:3px 12px;border-radius:99px}
main{max-width:480px;margin:-40px auto 0;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 28px)}
.card{background:var(--card);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 8px 28px rgba(7,47,46,.10)}
.sec{font-size:13px;font-weight:700;color:var(--ac);margin:16px 0 2px}
.sec:first-child{margin-top:0}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;font:inherit;font-size:16px;color:var(--tx);background:var(--in);border:1.5px solid var(--br);border-radius:12px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{margin:0}.chip input{display:none}
.chip span{display:inline-block;padding:8px 16px;border:1.5px solid var(--br);border-radius:99px;font-size:14px;color:var(--tx);cursor:pointer}
.chip input:checked+span{background:var(--ac);border-color:var(--ac);color:#fff}
button,.btn{display:block;width:100%;margin-top:10px;padding:13px;font:inherit;font-weight:700;font-size:15px;text-align:center;text-decoration:none;border:0;border-radius:14px;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;cursor:pointer}
.o{background:none!important;border:1.5px solid var(--ac)!important;color:var(--ac)!important}
#go{margin-top:18px;font-size:17px;padding:15px}
#err{color:var(--rd);font-size:13px;margin-top:10px}
#res{display:none;background:var(--acb)}
.lb{font-size:13px;color:var(--mu)}
.big{font-size:30px;font-weight:800;color:var(--ac);line-height:1.4}
.rng{display:flex;gap:8px;margin-top:10px}
.rng div{flex:1;background:var(--card);border-radius:12px;padding:8px 12px;font-size:13px;color:var(--mu)}
.rng b{display:block;font-size:15px;color:var(--tx)}
.ln{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:6px 0;border-bottom:1px dashed var(--br)}
.up{color:var(--ac)}.dn{color:var(--rd)}
small,.foot{color:var(--mu);display:block;margin-top:12px;font-size:12px}
.foot{text-align:center}
summary{font-weight:700;cursor:pointer;font-size:14px}
#lead{display:none;margin-top:14px;padding-top:6px;border-top:1px dashed var(--br)}
.adm h3{font-size:14px;margin:16px 0 0}.adm label{font-size:12px}
.warn{color:var(--rd);font-size:13px}

.hero{background:linear-gradient(135deg,#052625,#0f766e 55%,#14b8a6);padding:calc(env(safe-area-inset-top,0px) + 30px) 20px 74px}
.hero .by{display:inline-block;font-size:13px;background:rgba(255,255,255,.16);padding:3px 16px;border-radius:99px;margin-bottom:16px}
.hero h1{font-size:36px;font-weight:800;letter-spacing:-.5px;margin:0 0 8px;text-shadow:0 2px 16px rgba(0,0,0,.35)}
.hero h1:before{content:"";display:block;width:48px;height:4px;border-radius:4px;background:#fcd34d;margin:0 auto 14px}
.hero p{font-size:15px}
.ct{text-align:center}.ct h2{font-size:17px;margin:0 0 6px}.ct p{margin:0;font-size:14px;color:var(--mu)}
.num{direction:ltr;unicode-bidi:embed;font-weight:800;font-size:20px;letter-spacing:1px;margin:10px 0 2px;color:var(--ac)}
#inst{display:none;text-align:center}
#tb{position:fixed;top:0;left:0;right:0;z-index:9;display:none;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px;background:linear-gradient(135deg,#052625,#0f766e);color:#fff;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3);animation:dn .35s}
@keyframes dn{from{transform:translateY(-100%)}to{transform:none}}
#tb span{flex:1}#tb a{color:#fcd34d;font-weight:800;direction:ltr;unicode-bidi:embed;text-decoration:none;white-space:nowrap}
#tb button{width:auto;margin:0;padding:0 10px;background:none;color:#fff;font-size:22px;line-height:1;flex:none}
</style>
</head>
<body>
<div id="app"></div>
<script src="prices.js"></script>
<script>
const S=window.PRICES||{zones:{},params:{},contact:{},brand:'ملک‌سنج'};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nd=v=>String(v).replace(/[۰-۹]/g,d=>d.charCodeAt(0)-1776).replace(/[٠-٩]/g,d=>d.charCodeAt(0)-1632);
const num=v=>{v=nd(v).replace(/[٫،,]/g,'.').trim();return v===''?NaN:+v};
const P=[["ageDrop","کاهش قیمت به ازای هر سال قدمت (بعد از ۲ سال اول)","درصد",1.2],["ageMin","حداقل ضریب قدمت (سقف افت)","درصد قیمت نوساز",70],["smallBonus","افزایش متراژ کوچک (تا ۶۰ متر)","درصد",5],["bigDrop","کسر متراژ بزرگ (بالای ۱۲۰ متر)","درصد",3],["groundDrop","کسر طبقه همکف","درصد",7],["firstDrop","کسر طبقه اول","درصد",3],["noLiftDrop","کسر هر طبقه بالای ۲ بدون آسانسور","درصد",3],["liftBonus","افزایش آسانسور (ساختمان ۴ طبقه به بالا)","درصد",4],["fewBonus","افزایش ساختمان ≤۴ واحدی","درصد",3],["manyDrop","کسر ساختمان بیش از ۸ واحد","درصد",4],["parkDeduct","کسر نداشتن پارکینگ","میلیون تومان",250],["storBonus","ارزش انباری","میلیون تومان",80],["bed1Drop","کسر ۱ خوابه","درصد",3],["bed3Bonus","افزایش ۳ خواب و بیشتر","درصد",1],["deedDrop","کسر سند غیر تک‌برگ","درصد",15],["renoBonus","افزایش واحد بازسازی‌شده","درصد",6],["renoDrop","کسر واحد نیازمند بازسازی","درصد",8],["dirEffect","افزایش جنوبی / کسر شمالی","درصد",2],["spread","بازه حداقل/حداکثر ±","درصد",8]];
const p={};P.forEach(([k,,,d])=>p[k]=(typeof S.params[k]==='number')?S.params[k]:d);
const fa=n=>Math.round(n).toLocaleString('fa-IR');
const words=m=>m>=1000?(m/1000).toLocaleString('fa-IR',{maximumFractionDigits:2})+' میلیارد تومان':fa(m)+' میلیون تومان';
const r10=m=>Math.round(m/10)*10;
function nowYear(){try{const y=+new Intl.DateTimeFormat('en-u-ca-persian',{year:'numeric'}).formatToParts(new Date()).find(x=>x.type==='year').value;return y>1300?y:1405}catch(e){return 1405}}
const IG=((S.contact||{}).instagram||'').replace(/^@/,'').trim(),C=S.contact||{},PH=nd(C.phone||'').replace(/\D/g,''),TG=(C.telegram||'').replace(/^@|^https?:\/\/t\.me\//,'').trim();
let info=null,tbT;

function render(){
document.title=S.brand;
const opts=Object.keys(S.zones).map(z=>`<option>${esc(z)}</option>`).join('');
$('app').innerHTML=`<div id="tb"><span>برای مشاوره رایگان با شماره <a href="tel:${esc(PH)}">${esc((C.phone||'').replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]))}</a> تماس بگیرید</span><button id="tbx" aria-label="بستن">×</button></div><div class="hero">${S.credit?`<div class="by">${esc(S.credit)}</div>`:''}<h1>${esc(S.brand)}</h1><p>قیمت ملک خودت رو در ۳۰ ثانیه بسنج</p>${S.updated?`<span class="upd">آخرین به‌روزرسانی قیمت‌ها: ${esc(S.updated)}</span>`:''}</div>
<main id="mn"><div class="card">
<div class="sec">موقعیت و متراژ</div>
<label>منطقه</label><select id="zone">${opts}</select>
<div class="row"><div><label>متراژ (متر مربع)</label><input id="area" inputmode="decimal" placeholder="۸۵"></div><div><label>سال ساخت (شمسی)</label><input id="year" inputmode="numeric" placeholder="۱۳۹۵"></div></div>
<div class="sec">ساختمان</div>
<div class="row"><div><label>تعداد طبقات</label><input id="floors" inputmode="numeric" placeholder="۴"></div><div><label>طبقه واحد (۰ = همکف)</label><input id="floor" inputmode="numeric" placeholder="۲"></div></div>
<div class="row"><div><label>تعداد کل واحدها</label><input id="units" inputmode="numeric" placeholder="۸"></div><div><label>تعداد خواب</label><select id="bed"><option>۱</option><option selected>۲</option><option>۳</option><option>۴ یا بیشتر</option></select></div></div>
<div class="sec">وضعیت واحد</div>
<div class="row"><div><label>نوع سند</label><select id="deed"><option>تک‌برگ</option><option>قولنامه‌ای / سایر</option></select></div><div><label>وضعیت</label><select id="reno"><option>معمولی</option><option>بازسازی‌شده</option><option>نیازمند بازسازی</option></select></div></div>
<label>جهت ساختمان</label><select id="dir"><option>نمی‌دانم / فرقی ندارد</option><option>جنوبی</option><option>شمالی</option></select>
<div class="chips"><label class="chip"><input type="checkbox" id="park" checked><span>پارکینگ</span></label><label class="chip"><input type="checkbox" id="stor"><span>انباری</span></label><label class="chip"><input type="checkbox" id="lift"><span>آسانسور</span></label></div>
<div id="err" role="alert"></div><button id="go">محاسبه قیمت</button></div>
<div class="card" id="res"><div class="lb">قیمت تخمینی</div><div class="big" id="mid"></div><div class="lb" id="per"></div>
<div class="rng"><div>حداقل<b id="lo"></b></div><div>حداکثر<b id="hi"></b></div></div>
<details style="margin-top:14px"><summary>جزئیات محاسبه</summary><div id="det"></div></details>
<button class="o" id="shr">اشتراک‌گذاری نتیجه</button>

<small>این عدد یک برآورد کلی بر اساس میانگین بازار است و جایگزین کارشناسی رسمی نیست.</small></div>
<div class="card ct"><h2>فایل ملکتان را به ما بسپارید</h2>
<p>برای فروش یا اجاره‌ی ملک خود، مشخصات آن را به شماره‌ی زیر در واتساپ پیام دهید؛ همکاران ما با شما تماس می‌گیرند و خدمات حرفه‌ای املاک را ارائه می‌دهند.</p>
<div class="num">${esc(C.phone||'')}</div>
<a class="btn" id="wa" target="_blank" rel="noopener">پیام در واتساپ</a>
<a class="btn o" href="tel:${esc(PH)}">تماس با ما</a>
${IG?`<a class="btn o" href="https://instagram.com/${encodeURIComponent(IG)}" target="_blank" rel="noopener">اینستاگرام @${esc(IG)}</a>`:''}</div>
<div class="card" id="inst"></div>
<div class="foot">${esc(S.brand)} · اسلامشهر</div></main>`;
$('go').onclick=calc;$('shr').onclick=share;
setWa();showInst();$('tbx').onclick=()=>{$('tb').style.display='none'};
}

function anim(el,to){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/700);el.textContent=words(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)}

function calc(){
const e=m=>{$('err').textContent=m};
const a=num($('area').value),y=num($('year').value),fl=num($('floors').value),u=num($('units').value);let f=num($('floor').value);
const NOW=nowYear();
if(!(a>=20&&a<=2000))return e('متراژ را درست وارد کنید (بین ۲۰ تا ۲۰۰۰ متر).');
if(!(y>=1300&&y<=NOW+1))return e('سال ساخت را شمسی و چهار رقمی وارد کنید، مثلاً ۱۳۹۵.');
const fN=isNaN(fl)?1:fl,uN=isNaN(u)?6:u;if(isNaN(f))f=1;
if(f<0||f>fN&&!isNaN(fl))return e('طبقه واحد نمی‌تواند بیشتر از تعداد طبقات ساختمان باشد.');
e('');
const lift=$('lift').checked,z=$('zone').value,age=Math.max(0,NOW-y);
let m=a*S.zones[z];const base=m,L=[];
const ap=(t,k)=>{if(Math.abs(k-1)<1e-9)return;const d=m*(k-1);m+=d;L.push([t,d])};
ap('قدمت '+fa(age)+' سال',Math.max(p.ageMin/100,1-Math.max(0,age-2)*p.ageDrop/100));
if(a<=60)ap('متراژ کوچک',1+p.smallBonus/100);else if(a>120)ap('متراژ بزرگ',1-p.bigDrop/100);
if(f===0)ap('طبقه همکف',1-p.groundDrop/100);
else if(f===1)ap('طبقه اول',1-p.firstDrop/100);
else if(f>=3&&!lift)ap('طبقه '+fa(f)+' بدون آسانسور',Math.max(.8,1-(f-2)*p.noLiftDrop/100));
if(lift&&fN>=4)ap('آسانسور',1+p.liftBonus/100);
const bd=$('bed').selectedIndex;if(bd===0)ap('۱ خوابه',1-p.bed1Drop/100);else if(bd>=2)ap('۳ خواب و بیشتر',1+p.bed3Bonus/100);
if($('deed').selectedIndex===1)ap('سند غیر تک‌برگ',1-p.deedDrop/100);
const rn=$('reno').selectedIndex;if(rn===1)ap('بازسازی‌شده',1+p.renoBonus/100);else if(rn===2)ap('نیازمند بازسازی',1-p.renoDrop/100);
const dr=$('dir').selectedIndex;if(dr===1)ap('جهت جنوبی',1+p.dirEffect/100);else if(dr===2)ap('جهت شمالی',1-p.dirEffect/100);
if(uN<=4)ap('ساختمان کم‌واحد',1+p.fewBonus/100);else if(uN>8)ap('ساختمان پرواحد',1-p.manyDrop/100);
if(!$('park').checked){m-=p.parkDeduct;L.push(['نداشتن پارکینگ',-p.parkDeduct])}
if($('stor').checked){m+=p.storBonus;L.push(['انباری',p.storBonus])}
m=r10(Math.max(m,0));
const lo=r10(m*(1-p.spread/100)),hi=r10(m*(1+p.spread/100));
anim($('mid'),m);
$('per').textContent='حدود '+fa(m/a)+' میلیون تومان در هر متر';
$('lo').textContent=words(lo);$('hi').textContent=words(hi);
$('det').innerHTML=`<div class="ln"><span>قیمت پایه ملک نوساز (${fa(a)} متر × ${fa(S.zones[z])})</span><b>${words(base)}</b></div>`+L.map(([t,d])=>`<div class="ln"><span>${esc(t)}</span><b class="${d>=0?'up':'dn'}">${d>=0?'افزایش':'کاهش'} ${words(Math.abs(d))}</b></div>`).join('');
const txt=`ملک ${fa(a)} متری در ${z}، ساخت ${y}، طبقه ${fa(f)}، ${$('bed').value} خواب، سند ${$('deed').value}`;
info={txt,rng:`${words(lo)} تا ${words(hi)}`};
setWa();const tb=$('tb');tb.style.display='flex';clearTimeout(tbT);tbT=setTimeout(()=>{tb.style.display='none'},15000);$('res').style.display='block';
$('res').scrollIntoView({behavior:'smooth'});
}

async function share(){
if(!info)return;
const t=`برآورد قیمت: ${info.txt}\n${info.rng}\n${S.brand}`;
try{if(navigator.share)await navigator.share({text:t,url:location.href.split('#')[0]});else{await navigator.clipboard.writeText(t+'\n'+location.href.split('#')[0]);$('shr').textContent='کپی شد'}}catch(e){}
}

function setWa(){const w=$('wa');if(!w)return;const t='سلام، می‌خواهم ملکم را برای فروش یا اجاره به شما بسپارم.'+(info?`\nمشخصات: ${info.txt}\nبرآورد سایت: ${info.rng}`:'');w.href=`https://wa.me/98${PH.replace(/^0/,'')}?text=`+encodeURIComponent(t)}
let dp=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;showInst()});
function showInst(){const b=$('inst');if(!b)return;
if(matchMedia('(display-mode: standalone)').matches||navigator.standalone)return;
if(dp){b.style.display='block';b.innerHTML='<b>افزودن به صفحه اصلی گوشی</b><button id="ib">نصب ملک‌سنج</button>';$('ib').onclick=async()=>{dp.prompt();await dp.userChoice;dp=null;b.style.display='none'}}
else if(/iPhone|iPad|iPod/.test(navigator.userAgent)){b.style.display='block';b.innerHTML='<b>افزودن به صفحه اصلی گوشی</b><small>در سافاری دکمه‌ی اشتراک‌گذاری (Share) را بزنید و Add to Home Screen را انتخاب کنید.</small>'}}
function admin(){
const days=S.updatedISO?Math.floor((Date.now()-new Date(S.updatedISO))/864e5):null;
const d=document.createElement('div');d.className='card adm';
d.innerHTML=`<b>پنل مدیریت</b> <span class="lb">(فقط وقتی آدرس با #admin تمام شود دیده می‌شود)</span>
${days!==null&&days>=7?`<div class="warn">قیمت‌ها ${fa(days)} روز است به‌روز نشده‌اند.</div>`:''}
<h3>قیمت هر متر ملک نوساز (میلیون تومان)</h3>
${Object.keys(S.zones).map((z,i)=>`<label>${esc(z)}</label><input id="z${i}" inputmode="decimal" value="${S.zones[z]}">`).join('')}
<h3>ضریب‌ها و کسورات</h3>
${P.map(([k,t,u])=>`<label>${t} (${u})</label><input id="p_${k}" inputmode="decimal" value="${p[k]}">`).join('')}
<h3>نام و تماس</h3>
<label>نام ابزار</label><input id="c_brand" value="${esc(S.brand)}">
<label>متن پایین صفحه</label><input id="c_credit" value="${esc(S.credit||'')}">
<label>نام شما</label><input id="c_name" value="${esc(C.name||'')}">
<label>شماره موبایل شما (برای دریافت درخواست‌ها)</label><input id="c_phone" dir="ltr" inputmode="tel" value="${esc(C.phone||'')}">
<label>آیدی اینستاگرام (بدون @)</label><input id="c_ig" dir="ltr" value="${esc(C.instagram||'')}">
<button id="dl">دانلود prices.js جدید</button>
<small>فایل دانلودشده را جایگزین prices.js روی سایتت کن تا برای همه آپدیت شود.</small>`;
$('mn').prepend(d);
$('dl').onclick=()=>{
const zs=Object.keys(S.zones),nz={},np={};
for(let i=0;i<zs.length;i++){const v=num($('z'+i).value);if(!(v>0)){alert('قیمت «'+zs[i]+'» معتبر نیست');return}nz[zs[i]]=v}
for(const [k] of P){const v=num($('p_'+k).value);if(isNaN(v)||v<0){alert('یکی از ضریب‌ها معتبر نیست');return}np[k]=v}
S.zones=nz;S.params=np;S.brand=$('c_brand').value.trim()||S.brand;S.credit=$('c_credit').value.trim();
S.contact={name:$('c_name').value.trim(),phone:$('c_phone').value.trim(),instagram:$('c_ig').value.trim()};
S.updated=new Date().toLocaleDateString('fa-IR',{year:'numeric',month:'long',day:'numeric'});
S.updatedISO=new Date().toISOString().slice(0,10);
